[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["build", "install", "log", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4"]
ignore = ["A002"]

[tool.pytest.ini_options]
testpaths = ["test"]
junit_family = "xunit2"
