name: Verification

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: unit tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: |
          python -m pytest test/test_arithmetic.py test/test_cli.py \
            --junitxml=test-results/unit.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/

  ros2:
    name: ROS 2 ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            image: ros:humble-ros-base-jammy
          - distro: jazzy
            image: ros:jazzy-ros-base-noble
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      ROS_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest \
            ros-${ROS_DISTRO}-example-interfaces \
            ros-${ROS_DISTRO}-launch-testing \
            ros-${ROS_DISTRO}-launch-testing-ros
      - name: Build and run the integration suite
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          bash scripts/verify_ros2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-${{ matrix.distro }}-results
          path: test-results/
